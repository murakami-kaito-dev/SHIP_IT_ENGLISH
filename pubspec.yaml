name: ship_it_english
description: "海外テック企業で働くために必要な技術英語を毎日5〜10分の学習で習得するアプリ。"
publish_to: 'none'

version: 1.0.0+7

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  sqflite: ^2.3.3+1
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.1+2
  go_router: ^14.2.0
  path: ^1.9.0
  uuid: ^4.4.0
  intl: ^0.19.0
  timezone: ^0.9.3
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.5
  in_app_review: ^2.0.12
  in_app_purchase: ^3.2.3
  url_launcher: ^6.3.1
  share_plus: ^12.0.2
  file_picker: ^11.0.2
  path_provider: ^2.1.5
  # 事前生成した発音音声（Amazon Polly Neural）を実行時にオフライン再生する。
  audioplayers: ^6.1.0
  # 読み上げテキスト→音声ファイル名(sha1)の対応づけ。生成時・実行時で共通に使う。
  crypto: ^3.0.3
  # ゲーミフィケーション演出（紙吹雪）。純Dart・オフライン・軽量でネットワーク不使用。
  confetti: ^0.8.0
  # iOSホーム画面ウィジェット（ストリーク・今日の進捗をアプリ外に常時表示）。
  # App Group の UserDefaults 経由でデータを渡すだけ（非通信）。
  home_widget: ^0.7.0
  flutter_timezone: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/cards.json
    # 事前生成した発音音声（tools/generate_tts.dart が出力）。
    - assets/audio/manifest.json
    - assets/audio/en-US/
    - assets/audio/ja-JP/
    - assets/audio/sfx/

# アプリアイコン生成設定。マスター画像は assets/icon/app_icon.png（2048x2048）。
# 変更したら `dart run flutter_launcher_icons` を実行して各サイズを再生成する。
# iOSはアルファチャンネル禁止のため remove_alpha_ios で除去する。
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  ios: true
  remove_alpha_ios: true
  android: true
  min_sdk_android: 21
